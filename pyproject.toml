[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termagotchi"
version = "0.1.0"
description = "A tiny pet that lives in your terminal. Feeds on your git commits."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]

[project.scripts]
termagotchi = "termagotchi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termagotchi"]
